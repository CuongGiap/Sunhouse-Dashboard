services:
  - type: web
    name: sunhouse-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run Home.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: GOOGLE_AUTH_MODE
        value: service_account
      - key: CACHE_TTL_SECONDS
        value: 300
